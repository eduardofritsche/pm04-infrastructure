# Sobe a aplicação do cliente (repositório kube-shop-v2) na VM da loja.
# É a adaptação do compose.yaml dele para servidores separados: os serviços
# "api" e "frontend" ficam aqui, o "mongodb" fica na VM do banco (role mongodb).
# Mesmos nomes, portas, variáveis e endurecimento do compose; o que muda é o
# endereço do banco (IP privado) e a forma de entregar a senha (arquivo na VM).
# Detalhes: docs/integracao-app.md

- name: Criar a rede Docker da loja
  community.docker.docker_network:
    name: kubeshop

# Equivale ao "secrets: [mongo_app_password]" do compose. A API lê a senha de
# MONGO_PASSWORD_FILE, então ela não aparece em variáveis de ambiente nem no
# "docker inspect". Dono 1000 = usuário "node" da imagem da API.
- name: Criar a pasta de segredos da loja
  ansible.builtin.file:
    path: /opt/kubeshop/secrets
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Gravar a senha do banco para a API (vem do Secret MONGO_APP_PASSWORD)
  ansible.builtin.copy:
    content: "{{ mongo_app_password }}"
    dest: /opt/kubeshop/secrets/mongo-app-password
    owner: "1000"
    group: "1000"
    mode: "0400"
  no_log: true
  register: app_secret

- name: Subir a API na versão pedida (docker_tag) - {{ docker_tag }}
  community.docker.docker_container:
    name: api
    image: "{{ docker_image }}-api:{{ docker_tag }}"
    pull: "{{ 'always' if force_pull | bool else 'missing' }}"
    restart_policy: unless-stopped
    restart: "{{ app_secret is changed }}"
    state: started
    networks:
      - name: kubeshop
    env:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      APP_VERSION: "{{ docker_tag | string }}"
      # No compose era "mongodb" (nome do serviço); aqui é o IP privado da VM do banco.
      MONGO_HOST: "{{ db_internal_ip }}"
      MONGO_PORT: "27017"
      MONGO_DATABASE: "{{ mongo_db_name }}"
      MONGO_AUTH_SOURCE: "{{ mongo_db_name }}"
      MONGO_USERNAME: "{{ mongo_app_user }}"
      MONGO_PASSWORD_FILE: /run/secrets/mongo_app_password
    volumes:
      - /opt/kubeshop/secrets/mongo-app-password:/run/secrets/mongo_app_password:ro
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opts: [no-new-privileges:true]
    stop_timeout: 20
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/ready',{signal:AbortSignal.timeout(2500)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 30s

# Equivale ao "depends_on: api: condition: service_healthy" do compose: o
# frontend só é tocado depois que a API está conectada ao banco.
- name: Esperar a API ficar saudável (conectada ao MongoDB)
  community.docker.docker_container_info:
    name: api
  register: api_info
  until: api_info.container.State.Health.Status | default('') == 'healthy'
  retries: 36
  delay: 5

- name: Subir o frontend na versão pedida (docker_tag) - {{ docker_tag }}
  community.docker.docker_container:
    name: frontend
    image: "{{ docker_image }}-frontend:{{ docker_tag }}"
    pull: "{{ 'always' if force_pull | bool else 'missing' }}"
    restart_policy: unless-stopped
    state: started
    networks:
      - name: kubeshop
    # O Nginx do cliente escuta na 8080 (usuário sem root); a VM publica na 80.
    ports:
      - "80:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opts: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

- name: Verificar a loja de ponta a ponta (Nginx → API → MongoDB)
  ansible.builtin.uri:
    url: http://127.0.0.1/api/health/ready
    return_content: true
    status_code: [200, 503]
  register: ready
  until: ready.status == 200 and ready.json.ready | default(false)
  retries: 24
  delay: 5

- name: Consultar a versão e o catálogo pela loja
  ansible.builtin.uri:
    url: "http://127.0.0.1/api/{{ item }}"
    return_content: true
  loop: [info, products, orders]
  register: app_api

- name: Conferir se a versão no ar é a pedida
  vars:
    info: "{{ app_api.results[0].json }}"
    products: "{{ app_api.results[1].json.products }}"
    orders: "{{ app_api.results[2].json.orders }}"
  ansible.builtin.assert:
    that:
      - info.version == (docker_tag | string)
      - products | length > 0
    fail_msg: "Versão no ar {{ info.version }} ≠ docker_tag {{ docker_tag }} (ou catálogo vazio)"
    success_msg: "KubeShop {{ info.version }} no ar: banco conectado, {{ products | length }} produtos, {{ orders | length }} pedidos no histórico"
